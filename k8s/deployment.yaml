apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: p9-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      # Intentionally missing runAsNonRoot: Kyverno must reject this.
      containers:
        - name: demo-app
          image: p9-demo:fixed
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

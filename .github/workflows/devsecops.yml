name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: ${{ matrix.scanner }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scanner: [Gitleaks, Semgrep, Trivy-dependencies, Hadolint]
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks - current files
        if: matrix.scanner == 'Gitleaks'
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - name: Semgrep - SQL injection
        if: matrix.scanner == 'Semgrep'
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.181.0
          semgrep scan --config .semgrep.yml --error --metrics=off app.py
      - name: Trivy - dependencies
        if: matrix.scanner == 'Trivy-dependencies'
        run: >-
          docker run --rm -v "$PWD:/repo"
          aquasec/trivy:0.76.0 fs --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 /repo/requirements.txt
      - name: Hadolint - Dockerfile
        if: matrix.scanner == 'Hadolint'
        run: docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} .
      - name: Trivy - image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0 image --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 demo-app:${{ github.sha }}

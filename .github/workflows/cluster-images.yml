name: Prepare local cluster images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Kyverno images for the local amd64 cluster
        shell: bash
        run: |
          images=(
            reg.kyverno.io/kyverno/kyvernopre:v1.19.1
            reg.kyverno.io/kyverno/kyverno:v1.19.1
            reg.kyverno.io/kyverno/background-controller:v1.19.1
            reg.kyverno.io/kyverno/cleanup-controller:v1.19.1
            reg.kyverno.io/kyverno/reports-controller:v1.19.1
          )
          for image in "${images[@]}"; do docker pull --platform linux/amd64 "$image"; done
          docker image save --platform linux/amd64 -o cluster-images.tar "${images[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: p9-cluster-images
          path: cluster-images.tar
          retention-days: 1
          compression-level: 6

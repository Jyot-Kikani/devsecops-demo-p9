apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-p9
  annotations:
    pod-policies.kyverno.io/autogen-controllers: Deployment
spec:
  background: false
  rules:
    - name: require-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [p9-demo]
      validate:
        failureAction: Enforce
        message: "P9: set spec.securityContext.runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
